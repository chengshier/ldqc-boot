#blade配置
blade:
  #oauth2配置
  oauth2:
    #启用 oauth2
    enabled: true
    #使用 @org.springblade.test.Sm2KeyGenerator 获取,用于国密sm2验签,需和前端保持一致
#    public-key: ${BLADE_OAUTH2_PUBLIC_KEY}
    public-key: 0423bf132c92b0b088991dd9fc89a71815ec44ef04ecb25eb96cc3fac3ad6d74d08e9c683bbfbd39d64ff7489775d6bca8e0c39de237bdd875b6c2d7a5b652b163
    #使用 @org.springblade.test.Sm2KeyGenerator 获取,用于国密sm2解密,前端无需配置
#    private-key: ${BLADE_OAUTH2_PRIVATE_KEY}
    private-key: 008a264be51b40a7c6d251a58b8e1db7002006a76626eb7b3298af62229b553e20
  #token配置
  token:
    #是否有状态
    state: false
    #是否单用户登录
    single: false
    #单用户登录范围
    single-level: all
    #token签名 使用 @org.springblade.test.SignKeyGenerator 获取
#    sign-key: ${BLADE_TOKEN_SIGN_KEY}
    sign-key: 1BtXSNKS8EIOQeEGomiOeEFgcktMHYId
    #token加密 使用 @org.springblade.test.CryptoKeyGenerator 获取
#    crypto-key: ${BLADE_TOKEN_CRYPTO_KEY}
    crypto-key: gR9OtvERGyk9tUeJglVMCaIUmAhYljLI
  #接口配置
  api:
    #报文加密配置
    crypto:
      #启用报文加密配置
      enabled: false
      #使用 @org.springblade.test.CryptoKeyGenerator 获取,需和前端保持一致
#      aes-key: ${BLADE_API_CRYPTO_AES_KEY}
      aes-key: pIbyIZ6OPM49f7tAgaPR8gvBkndhqYiN
      #使用 @org.springblade.test.CryptoKeyGenerator 获取,需和前端保持一致
#      des-key: ${BLADE_API_CRYPTO_DES_KEY}
      des-key: XZKtpYTErYoDeH4A
  #jackson配置
  jackson:
    #null自动转空值
    null-to-empty: true
    #大数字自动转字符串
    big-num-to-string: true
    #支持text文本请求,与报文加密同时开启
    support-text-plain: false
  #redis序列化方式
  redis:
    serializer-type: protostuff
  #日志配置
  log:
    request:
      #开启控制台请求日志
      enabled: true
      #控制台请求日志忽略
      skip-url:
        - /blade-desk/notice/list
        - /blade-chat/weixin/**
      #开启错误日志入库
      error-log: true
  #xss配置
  xss:
    enabled: true
    skip-url:
      - /blade-chat/wechat
      - /blade-chat/qq
  #安全框架配置
  secure:
    #严格模式
    #缺失令牌字段则取消授权
    strict-token: true
    #缺失请求头则取消授权
    strict-header: true
    #接口放行
    skip-url:
      - /blade-test/**
    #授权认证配置
    auth:
      - method: ALL
        pattern: /blade-chat/wechat/**
        expression: "hasAuth()"
      - method: ALL
        pattern: /blade-chat/qq/**
        expression: "hasStrictToken()"
      - method: ALL
        pattern: /blade-chat/ding/**
        expression: "hasStrictHeader()"
      - method: ALL
        pattern: /blade-chat/blog/**
        expression: "hasMenu('blog')"
      - method: POST
        pattern: /blade-desk/dashboard/upload
        expression: "hasTimeAuth(9, 17)"
      - method: POST
        pattern: /blade-desk/dashboard/submit
        expression: "hasAnyRole('administrator', 'admin', 'user')"
    #基础认证配置
    basic:
      - method: ALL
        pattern: /blade-desk/dashboard/info
        username: "blade"
        password: "blade"
    #动态签名认证配置
    sign:
      - method: ALL
        pattern: /blade-desk/dashboard/sign
        crypto: "sha1"
    #多终端认证配置
    client:
      - client-id: sword
        path-patterns:
          - /blade-sword/**
      - client-id: saber
        path-patterns:
          - /blade-saber/**
  #多租户配置
  tenant:
    #多租户增强
    enhance: true
    #多租户授权保护
    license: false
    #动态数据库隔离功能
    dynamic-datasource: false
    #动态数据库隔离全局扫描
    dynamic-global: false
    #多租户字段名
    column: tenant_id
    #排除多租户逻辑
    exclude-tables:
      - blade_user
  #分库分表配置
  sharding:
    enabled: false


