# retry-trigger: 2
name: Patch comment audit closure

on:
  push:
    branches:
      - refactor/market-ready-phase1
    paths:
      - '.github/workflows/patch-comment-audit-closure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-ready-phase1
          fetch-depth: 0
      - name: Patch comment identity and retry scheduling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          comment_service = Path('src/main/java/org/springblade/modules/comment/service/impl/CommentServiceImpl.java')
          text = comment_service.read_text(encoding='utf-8')
          if 'org.springblade.core.secure.utils.AuthUtil;' not in text:
              text = text.replace('import org.springblade.core.tool.jackson.JsonUtil;\n', 'import org.springblade.core.tool.jackson.JsonUtil;\nimport org.springblade.core.secure.utils.AuthUtil;\nimport org.springblade.core.log.exception.ServiceException;\n', 1)
          marker = '''\tpublic CommentVO addComment(CommentDTO commentDTO) {
\t\tCommentEntity comment = BeanUtil.copy(commentDTO, CommentEntity.class);'''
          replacement = '''\tpublic CommentVO addComment(CommentDTO commentDTO) {
\t\tLong currentUserId = AuthUtil.getUserId();
\t\tif (Func.isEmpty(currentUserId) || currentUserId <= 0) {
\t\t\tthrow new ServiceException("请先登录后再发表评论");
\t\t}
\t\tcommentDTO.setUid(currentUserId);
\t\tCommentEntity comment = BeanUtil.copy(commentDTO, CommentEntity.class);'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif 'commentDTO.setUid(currentUserId);' not in text:
              raise SystemExit('comment add identity marker missing')
          task_marker = '''\t\ttask.setResultMessage(auditResult.reason()); task.setAttemptCount(1); task.setAuditTime(comment.getAuditTime());
\t\tauditTaskService.save(task);'''
          task_replacement = '''\t\ttask.setResultMessage(auditResult.reason()); task.setAttemptCount(1); task.setAuditTime(comment.getAuditTime());
\t\tif (auditResult.status() == WechatContentAuditService.RETRY) {
\t\t\ttask.setNextRetryTime(new Date(System.currentTimeMillis() + 60_000L));
\t\t}
\t\tauditTaskService.save(task);'''
          if task_marker in text:
              text = text.replace(task_marker, task_replacement, 1)
          elif 'task.setNextRetryTime' not in text:
              raise SystemExit('comment retry marker missing')
          delete_marker = '''\t\tCommentEntity comment = this.getById(id);
\t\tif (comment == null) return;

\t\tImgDetailEntity imgDetail = imgDetailService.getById(comment.getMid());'''
          delete_replacement = '''\t\tCommentEntity comment = this.getById(id);
\t\tif (comment == null) return;
\t\tLong currentUserId = AuthUtil.getUserId();
\t\tif (Func.isEmpty(currentUserId) || !Objects.equals(comment.getUid(), currentUserId)) {
\t\t\tthrow new ServiceException("只能删除自己的评论");
\t\t}

\t\tImgDetailEntity imgDetail = imgDetailService.getById(comment.getMid());'''
          if delete_marker in text:
              text = text.replace(delete_marker, delete_replacement, 1)
          elif '只能删除自己的评论' not in text:
              raise SystemExit('comment delete ownership marker missing')
          comment_service.write_text(text, encoding='utf-8')

          comment_controller = Path('src/main/java/org/springblade/modules/comment/controller/CommentController.java')
          text = comment_controller.read_text(encoding='utf-8')
          protected_mappings = [
              '@GetMapping("/detail")', '@GetMapping("/list")', '@GetMapping("/page")',
              '@PostMapping("/save")', '@PostMapping("/update")', '@PostMapping("/submit")',
              '@PostMapping("/remove")'
          ]
          for mapping in protected_mappings:
              token = '\t' + mapping
              secured = '\t@IsAdmin\n\t' + mapping
              if secured not in text and token in text:
                  text = text.replace(token, secured, 1)
          comment_controller.write_text(text, encoding='utf-8')

          news_controller = Path('src/main/java/org/springblade/modules/newscomment/controller/NewsCommentController.java')
          text = news_controller.read_text(encoding='utf-8')
          if 'org.springblade.core.secure.utils.AuthUtil;' not in text:
              text = text.replace('import org.springblade.core.secure.annotation.IsAdmin;\n', 'import org.springblade.core.secure.annotation.IsAdmin;\nimport org.springblade.core.secure.utils.AuthUtil;\nimport org.springblade.core.log.exception.ServiceException;\n', 1)
          if 'org.springblade.modules.system.service.IUserService;' not in text:
              text = text.replace('import org.springblade.modules.usermessage.service.IUserMessageService;\n', 'import org.springblade.modules.usermessage.service.IUserMessageService;\nimport org.springblade.modules.system.pojo.entity.User;\nimport org.springblade.modules.system.service.IUserService;\n', 1)
          field_marker = '\tprivate final IUserMessageService userMessageService;'
          if '\tprivate final IUserService userService;' not in text:
              text = text.replace(field_marker, field_marker + '\n\tprivate final IUserService userService;', 1)
          for mapping in protected_mappings:
              token = '\t' + mapping
              secured = '\t@IsAdmin\n\t' + mapping
              if secured not in text and token in text:
                  text = text.replace(token, secured, 1)
          mobile_marker = '''\tpublic R<Map<String, Object>> mobileSave(@RequestBody NewsCommentEntity newsComment) {
\t\tif (newsComment.getNewsId() == null) {'''
          mobile_replacement = '''\tpublic R<Map<String, Object>> mobileSave(@RequestBody NewsCommentEntity newsComment) {
\t\tLong currentUserId = AuthUtil.getUserId();
\t\tif (Func.isEmpty(currentUserId) || currentUserId <= 0) {
\t\t\tthrow new ServiceException("请先登录后再发表评论");
\t\t}
\t\tUser currentUser = userService.getById(currentUserId);
\t\tif (currentUser == null) {
\t\t\tthrow new ServiceException("用户不存在");
\t\t}
\t\tnewsComment.setUserId(currentUserId);
\t\tnewsComment.setUsername(Func.isNotBlank(currentUser.getName()) ? currentUser.getName() : currentUser.getRealName());
\t\tnewsComment.setAvatar(currentUser.getAvatar());
\t\tif (newsComment.getNewsId() == null) {'''
          if mobile_marker in text:
              text = text.replace(mobile_marker, mobile_replacement, 1)
          elif 'newsComment.setUserId(currentUserId);' not in text:
              raise SystemExit('news comment identity marker missing')
          task_marker = '''\t\ttask.setResultMessage(auditResult.reason()); task.setAttemptCount(1); task.setAuditTime(newsComment.getAuditTime());
\t\tauditTaskService.save(task);'''
          task_replacement = '''\t\ttask.setResultMessage(auditResult.reason()); task.setAttemptCount(1); task.setAuditTime(newsComment.getAuditTime());
\t\tif (auditResult.status() == WechatContentAuditService.RETRY) {
\t\t\ttask.setNextRetryTime(new java.util.Date(System.currentTimeMillis() + 60_000L));
\t\t}
\t\tauditTaskService.save(task);'''
          if task_marker in text:
              text = text.replace(task_marker, task_replacement, 1)
          elif 'task.setNextRetryTime' not in text:
              raise SystemExit('news comment retry marker missing')
          news_controller.write_text(text, encoding='utf-8')
          PY
      - name: Validate source boundaries
        shell: bash
        run: |
          grep -q 'commentDTO.setUid(currentUserId)' src/main/java/org/springblade/modules/comment/service/impl/CommentServiceImpl.java
          grep -q '只能删除自己的评论' src/main/java/org/springblade/modules/comment/service/impl/CommentServiceImpl.java
          grep -q 'newsComment.setUserId(currentUserId)' src/main/java/org/springblade/modules/newscomment/controller/NewsCommentController.java
          grep -q 'task.setNextRetryTime' src/main/java/org/springblade/modules/comment/service/impl/CommentServiceImpl.java
          grep -q 'task.setNextRetryTime' src/main/java/org/springblade/modules/newscomment/controller/NewsCommentController.java
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-comment-audit-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/springblade/modules/comment/service/impl/CommentServiceImpl.java \
                  src/main/java/org/springblade/modules/comment/controller/CommentController.java \
                  src/main/java/org/springblade/modules/newscomment/controller/NewsCommentController.java \
                  .github/workflows/patch-comment-audit-closure.yml
          git commit -m 'fix: secure comment identity and schedule audit retries'
          git push origin HEAD:refactor/market-ready-phase1
