name: Market-ready backend compile

on:
  pull_request:
    branches: [master]
  push:
    branches: [refactor/market-ready-phase1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-invalid-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-ready-phase1
          fetch-depth: 0
      - name: Route inaccessible media to manual review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/org/springblade/modules/contentaudit/service/DynamicContentAutoAuditService.java')
          text = path.read_text(encoding='utf-8')
          old = '''\tprivate void addHttpUrl(Set<String> urls, String value) {
\t\tif (Func.isBlank(value)) return;
\t\tString url = value.trim();
\t\tString lower = url.toLowerCase(Locale.ROOT);
\t\tif (lower.startsWith("http://") || lower.startsWith("https://")) {
\t\t\turls.add(url);
\t\t}
\t}'''
          new = '''\tprivate void addHttpUrl(Set<String> urls, String value) {
\t\tif (Func.isBlank(value)) return;
\t\t// 相对路径或内网地址也保留为审核任务，由 submitMedia 明确转人工待办，
\t\t// 避免动态静默卡在待审核状态。
\t\turls.add(value.trim());
\t}'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected dynamic media URL block was not found')

          Path('.github/workflows/one-time-fix-dynamic-media-url.yml').unlink(missing_ok=True)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/springblade/modules/contentaudit/service/DynamicContentAutoAuditService.java .github/workflows/one-time-fix-dynamic-media-url.yml
          git commit -m 'fix: route inaccessible dynamic media to manual review'
          git push origin HEAD:refactor/market-ready-phase1

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate private repository credential
        shell: bash
        env:
          BLADEX_AUTHORIZATION: ${{ secrets.BLADEX_AUTHORIZATION }}
        run: |
          if [ -z "$BLADEX_AUTHORIZATION" ]; then
            echo "::error::Repository secret BLADEX_AUTHORIZATION is not configured. Store the complete Authorization header value in this secret."
            exit 1
          fi

      - name: Generate temporary Maven settings
        shell: bash
        env:
          BLADEX_AUTHORIZATION: ${{ secrets.BLADEX_AUTHORIZATION }}
        run: |
          mkdir -p "$HOME/.m2"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          authorization = os.environ['BLADEX_AUTHORIZATION']
          settings = f'''<?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <localRepository>{Path.home() / '.m2' / 'repository'}</localRepository>
            <servers>
              <server>
                <id>bladex</id>
                <configuration>
                  <httpHeaders>
                    <property>
                      <name>Authorization</name>
                      <value>{escape(authorization)}</value>
                    </property>
                  </httpHeaders>
                </configuration>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>aliyun-repos</id>
                <name>Aliyun Public Repository</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>*,!bladex</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          '''
          Path.home().joinpath('.m2', 'settings.xml').write_text(settings, encoding='utf-8')
          PY

      - name: Compile backend
        shell: bash
        run: |
          set -o pipefail
          mvn -B -U -s "$HOME/.m2/settings.xml" -DskipTests compile 2>&1 | tee backend-compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-log
          path: backend-compile.log
          if-no-files-found: ignore
          retention-days: 7
