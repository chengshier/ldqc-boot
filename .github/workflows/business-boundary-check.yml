name: Backend business boundary guard

on:
  pull_request:
    branches: [master]
  push:
    branches: [refactor/market-ready-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate server-derived identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'src/main/java/org/springblade/modules/recommend/controller/RecommendController.java': [
                  'AuthUtil.getUserId()',
                  'recommendService.homeFeed(page, limit, currentUserId())',
                  '@PostMapping("/feedback")',
                  'recommendFeedbackService.record(request, currentUserId())',
              ],
              'src/main/java/org/springblade/modules/comment/controller/CommentController.java': [
                  'comment.setUid(currentUserId)',
                  '只能删除自己的评论',
              ],
              'src/main/java/org/springblade/modules/newscomment/controller/NewsCommentController.java': [
                  'newsComment.setUserId(currentUserId)',
                  'newsComment.setUsername',
              ],
              'src/main/java/org/springblade/modules/sportinvite/service/impl/SportInviteServiceImpl.java': [
                  'apply.setApplicantUserId(userId)',
                  'sportInvite.setPublisherUserId(userId)',
                  'occupySeatOrThrow',
              ],
              'src/main/java/org/springblade/modules/recommendfeedback/service/RecommendFeedbackService.java': [
                  'record(RecommendFeedbackRequest request, Long userId)',
                  'event.setUserId(userId)',
                  'NOT_INTERESTED',
              ],
          }
          failures = []
          for file_name, tokens in required.items():
              path = Path(file_name)
              if not path.exists():
                  failures.append(f'Missing file: {file_name}')
                  continue
              text = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      failures.append(f'{file_name} missing boundary marker: {token}')
          if failures:
              raise SystemExit('Server identity boundary failed:\n' + '\n'.join(failures))
          print('Server-derived identity boundaries passed.')
          PY
      - name: Validate BladeX base-field and business-status boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'doc/sql/training-video-course-migration.sql': [
                  'CREATE TABLE IF NOT EXISTS ldqc_training_access',
                  'CREATE TABLE IF NOT EXISTS ldqc_training_progress',
                  'status int NOT NULL DEFAULT 1',
                  'create_dept bigint DEFAULT NULL',
              ],
              'doc/sql/coupon-security-migration.sql': [
                  '`create_dept` bigint DEFAULT NULL',
                  '`tenant_id` varchar(12) NOT NULL DEFAULT',
              ],
              'doc/sql/coupon_verify_log_runtime_fix.sql': [
                  "'verify_status'",
                  "'create_dept'",
                  'idx_coupon_verify_log_coupon_status',
              ],
              'doc/sql/blade_base_fields_compatibility_upgrade.sql': [
                  "CALL ensure_blade_fields('ldqc_training_access')",
                  "CALL ensure_blade_fields('coupon_verifier_scope')",
                  "CALL ensure_blade_fields('mall_exchange_order')",
              ],
              'doc/sql/mall_exchange_order_status_runtime_fix.sql': [
                  "'order_status'",
                  'MODIFY COLUMN status int NOT NULL DEFAULT 1',
              ],
              'doc/sql/market_ready_phase1_schema_validation.sql': [
                  'BladeX 基础字段矩阵',
                  '业务状态误用',
              ],
          }
          failures = []
          for file_name, tokens in required.items():
              path = Path(file_name)
              if not path.exists():
                  failures.append(f'Missing file: {file_name}')
                  continue
              text = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      failures.append(f'{file_name} missing schema marker: {token}')

          mall_entity = Path('src/main/java/org/springblade/modules/mallexchangeorder/pojo/entity/MallExchangeOrderEntity.java')
          if not mall_entity.exists():
              failures.append(f'Missing file: {mall_entity}')
          else:
              text = mall_entity.read_text(encoding='utf-8')
              if '@TableField("status")' in text:
                  failures.append('MallExchangeOrderEntity still maps business order status to BladeX status')
              if 'private String orderStatus;' not in text:
                  failures.append('MallExchangeOrderEntity missing dedicated orderStatus field')

          if failures:
              raise SystemExit('BladeX schema boundary failed:\n' + '\n'.join(failures))
          print('BladeX base fields and business-status boundaries passed.')
          PY
      - name: Validate automatic content audit boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'src/main/java/org/springblade/modules/contentaudit/service/WechatContentAuditService.java': [
                  'msg_sec_check',
                  'media_check_async',
                  '"review".equals(value)',
              ],
              'src/main/java/org/springblade/modules/contentaudit/service/DynamicContentAutoAuditService.java': [
                  'IMG_DETAIL_TEXT',
                  'IMG_DETAIL_MEDIA',
                  'allRequiredTasksPassed',
                  'handleMediaCallback',
              ],
              'src/main/java/org/springblade/modules/contentaudit/controller/WechatMediaAuditCallbackController.java': [
                  'verifySignature',
                  'WECHAT.message-token',
                  'trace_id',
              ],
              'src/main/java/org/springblade/modules/contentaudit/service/ContentAuditTaskServiceImpl.java': [
                  'MAX_ATTEMPTS',
                  'MANUAL_REQUIRED',
                  'PROCESSING_TIMEOUT',
              ],
              'src/main/java/org/springblade/modules/imgDetail/controller/ImgDetailController.java': [
                  'startSubmissionAsync',
                  '人工复核或下架内容',
              ],
          }
          failures = []
          for file_name, tokens in required.items():
              path = Path(file_name)
              if not path.exists():
                  failures.append(f'Missing file: {file_name}')
                  continue
              text = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      failures.append(f'{file_name} missing automatic-audit marker: {token}')
          if failures:
              raise SystemExit('Automatic content audit boundary failed:\n' + '\n'.join(failures))
          print('Automatic content audit boundaries passed.')
          PY
      - name: Validate retired business bypasses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          violations = []
          coupon_controllers = list(Path('src/main/java/org/springblade/modules').rglob('*Coupon*Controller.java'))
          for path in coupon_controllers:
              text = path.read_text(encoding='utf-8')
              if '@RequestMapping("/use")' in text or '@PostMapping("/use")' in text:
                  violations.append(f'Legacy coupon direct-use endpoint: {path}')

          mall_files = list(Path('src/main/java/org/springblade/modules').rglob('*Mall*Controller.java'))
          for path in mall_files:
              text = path.read_text(encoding='utf-8')
              if 'exchangeMallProduct' in text:
                  violations.append(f'Legacy mall exchange method: {path}')

          if not Path('docs/market-ready/venue-booking-deferred-boundary.md').exists():
              violations.append('Venue booking deferred-boundary document is missing')
          if not Path('docs/market-ready/dynamic-content-wechat-audit.md').exists():
              violations.append('Dynamic content WeChat audit guide is missing')
          if not Path('doc/sql/dynamic_content_auto_audit_upgrade.sql').exists():
              violations.append('Dynamic content audit SQL upgrade is missing')

          if violations:
              raise SystemExit('Retired business bypass validation failed:\n' + '\n'.join(violations))
          print('Retired business bypasses remain closed.')
          PY
