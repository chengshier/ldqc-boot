name: One-time dynamic media audit fix

on:
  push:
    branches: [refactor/market-ready-phase1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-ready-phase1
          fetch-depth: 0
      - name: Preserve invalid media URLs as audit tasks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # This workflow is intentionally one-time and deletes itself after applying the patch.
          path = Path('src/main/java/org/springblade/modules/contentaudit/service/DynamicContentAutoAuditService.java')
          text = path.read_text(encoding='utf-8')
          old = '''\tprivate void addHttpUrl(Set<String> urls, String value) {
\t\tif (Func.isBlank(value)) return;
\t\tString url = value.trim();
\t\tString lower = url.toLowerCase(Locale.ROOT);
\t\tif (lower.startsWith("http://") || lower.startsWith("https://")) {
\t\t\turls.add(url);
\t\t}
\t}'''
          new = '''\tprivate void addHttpUrl(Set<String> urls, String value) {
\t\tif (Func.isBlank(value)) return;
\t\t// 即使是相对路径或内网地址也保留为审核任务，随后由 submitMedia
\t\t// 明确转为人工待办，避免动态静默卡在待审核状态。
\t\turls.add(value.trim());
\t}'''
          if old not in text:
              if new in text:
                  print('Dynamic media URL handling already patched.')
              else:
                  raise SystemExit('Expected addHttpUrl block was not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/one-time-fix-dynamic-media-url.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/springblade/modules/contentaudit/service/DynamicContentAutoAuditService.java .github/workflows/one-time-fix-dynamic-media-url.yml
          git commit -m 'fix: route inaccessible dynamic media to manual review'
          git push origin HEAD:refactor/market-ready-phase1
